name: goalyn
description: "Goalyn - Premium Football Scores & News"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.4
  timeago: ^3.7.0

  # Notifications (real scheduled local notifications)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Pull to refresh
  pull_to_refresh_flutter3: ^2.0.2

  # XML parsing for RSS feeds
  xml: ^6.5.0

  # Premium typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/