workflows:
  ios-testflight:
    name: Goalyn — TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: goalyn
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tanaltay.goalyn
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn"
        BUNDLE_ID: "com.tanaltay.goalyn"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        ignore_failure: true
        script: |
          flutter analyze
      - name: Flutter unit tests
        ignore_failure: true
        script: |
          flutter test
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa and automatic versioning
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Submit to TestFlight, do not auto-release to App Store.
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
        submit_to_app_store: false

  ios-release:
    name: Goalyn — App Store release (metadata + binary)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: goalyn
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tanaltay.goalyn
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn"
        BUNDLE_ID: "com.tanaltay.goalyn"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        LANG: "en_US.UTF-8"
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: 3.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Flutter pub get
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Install fastlane
        script: |
          gem install bundler
          gem install fastlane -v 2.224.0 --no-document
      - name: Flutter build ipa with auto-incremented build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Push App Store metadata via Fastlane
        script: |
          export APP_STORE_CONNECT_API_KEY_KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          export APP_STORE_CONNECT_API_KEY_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          export APP_STORE_CONNECT_API_KEY_PATH="$CM_BUILD_DIR/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          if [ ! -f "$APP_STORE_CONNECT_API_KEY_PATH" ] && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$APP_STORE_CONNECT_API_KEY_PATH"
          fi
          bundle exec fastlane ios upload_metadata || fastlane ios upload_metadata
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
