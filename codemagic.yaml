workflows:
  ios-testflight:
    name: Goalyn — TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn.app"
        BUNDLE_ID: "com.tanaltay.goalyn.app"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Register bundle id (idempotent)
        script: |
          app-store-connect bundle-ids register "$BUNDLE_ID" \
            --name "Goalyn iOS" \
            --platform IOS || true
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch (or create) signing files
        script: |
          set -ex
          openssl genrsa -out /tmp/cert_priv.key 2048
          ls -la /tmp/cert_priv.key
          echo "Bundle: $BUNDLE_ID, Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_priv.key \
            --p12-password "$CERTIFICATE_PASSWORD" \
            --create \
            --verbose
      - name: Add fetched certificates to keychain
        script: |
          keychain add-certificates --certificate-password "$CERTIFICATE_PASSWORD"
      - name: Set up code signing in Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa with timestamp build number
        script: |
          # Use Unix timestamp as build number — guarantees monotonic increase
          # and avoids ENTITY_ERROR.DUPLICATE caused by stale Apple records.
          BUILD_NUMBER=$(date +%s)
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload to TestFlight
        script: |
          set -x
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading $IPA_FILE"
          echo "Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "Issuer: $APP_STORE_CONNECT_ISSUER_ID"
          echo "p8 length: ${#APP_STORE_CONNECT_PRIVATE_KEY}"

          # Try multiple variations of decoding the p8 secret.
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"

          # Variation A: write as-is (Codemagic stores newlines verbatim).
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$P8"
          chmod 600 "$P8"
          cp "$P8" ~/private_keys/

          echo "--- p8 head ---"
          head -2 "$P8" || true
          echo "--- p8 tail ---"
          tail -2 "$P8" || true
          echo "--- p8 line count ---"
          wc -l "$P8" || true

          # If the file is a single line (escaped), try decoding once.
          if [ "$(wc -l < "$P8")" -le 1 ]; then
            echo "Single-line p8 detected, decoding escaped newlines"
            python3 -c "import sys; d=open(sys.argv[1]).read().replace('\\\\n','\\n'); open(sys.argv[1],'w').write(d)" "$P8"
            cp "$P8" ~/private_keys/
            head -2 "$P8" || true
          fi

          # Validate PEM format
          openssl pkcs8 -in "$P8" -nocrypt -inform PEM -outform PEM > /dev/null && echo "p8 is valid PEM" || echo "p8 PARSE FAILED"

          # Run altool
          xcrun altool --upload-app --type ios -f "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" --verbose 2>&1 | tail -80
      - name: Push metadata + screenshots via Fastlane
        script: |
          set -e
          # Restore p8 — Fastfile's load_api_key lane reads it from disk.
          mkdir -p ~/.appstoreconnect/private_keys
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          if [ ! -f "$P8" ]; then
            python3 -c "import os, sys; v=os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].replace('\\\\n','\\n'); open(sys.argv[1],'w').write(v)" "$P8"
            chmod 600 "$P8"
          fi
          export APP_STORE_CONNECT_API_KEY_PATH="$P8"
          # Codemagic mac instance ships fastlane already; no install needed.
          fastlane ios upload_metadata || echo "metadata upload step warned"
          fastlane ios upload_screenshots || echo "screenshot upload step warned"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Goalyn — App Store metadata + binary
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn.app"
        BUNDLE_ID: "com.tanaltay.goalyn.app"
        LANG: "en_US.UTF-8"
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: 3.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Flutter pub get
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Initialize keychain & fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Install fastlane
        script: |
          gem install bundler
          gem install fastlane -v 2.224.0 --no-document
      - name: Push App Store metadata via Fastlane
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          export APP_STORE_CONNECT_API_KEY_KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          export APP_STORE_CONNECT_API_KEY_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          export APP_STORE_CONNECT_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          fastlane ios upload_metadata
      - name: Upload binary to TestFlight
        script: |
          app-store-connect publish --path "build/ios/ipa/*.ipa" --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
