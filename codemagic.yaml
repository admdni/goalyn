workflows:
  ios-testflight:
    name: Goalyn — TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn"
        BUNDLE_ID: "com.tanaltay.goalyn"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Register bundle id (idempotent)
        script: |
          app-store-connect bundle-ids register "$BUNDLE_ID" \
            --name "Goalyn iOS" \
            --platform IOS || true
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch (or create) signing files
        script: |
          # Generate a fresh RSA key to back the new distribution certificate.
          openssl genrsa -out /tmp/cert_priv.key 2048

          # `fetch-signing-files` issues both the certificate and the App Store
          # provisioning profile when `--create` is set, using the key above
          # as the certificate private key.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_priv.key \
            --p12-password "$CERTIFICATE_PASSWORD" \
            --create
      - name: Add fetched certificates to keychain
        script: |
          keychain add-certificates --certificate-password "$CERTIFICATE_PASSWORD"
      - name: Set up code signing in Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa with auto-incremented build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload to TestFlight
        script: |
          set -eo pipefail

          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading $IPA_FILE"

          # Restore the p8 to the on-disk location altool looks at.
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$P8"
          # Replace literal "\n" sequences (Codemagic stores secure values
          # with escaped newlines) with real newlines for PEM parsing.
          python3 -c "import os, sys; p=os.environ['P8']; data=open(p).read().replace('\\\\n','\\n'); open(p,'w').write(data)" P8="$P8" 2>/dev/null || true
          chmod 600 "$P8"
          cp "$P8" ~/private_keys/

          # Use altool directly — it's the most reliable path on Codemagic.
          xcrun altool --upload-app --type ios -f "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Goalyn — App Store metadata + binary
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn"
        BUNDLE_ID: "com.tanaltay.goalyn"
        LANG: "en_US.UTF-8"
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: 3.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Flutter pub get
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Initialize keychain & fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Install fastlane
        script: |
          gem install bundler
          gem install fastlane -v 2.224.0 --no-document
      - name: Push App Store metadata via Fastlane
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          export APP_STORE_CONNECT_API_KEY_KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          export APP_STORE_CONNECT_API_KEY_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          export APP_STORE_CONNECT_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          fastlane ios upload_metadata
      - name: Upload binary to TestFlight
        script: |
          app-store-connect publish --path "build/ios/ipa/*.ipa" --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
