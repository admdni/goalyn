workflows:
  ios-testflight:
    name: Goalyn — TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn.app"
        BUNDLE_ID: "com.tanaltay.goalyn.app"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Register bundle id (idempotent)
        script: |
          app-store-connect bundle-ids register "$BUNDLE_ID" \
            --name "Goalyn iOS" \
            --platform IOS || true
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch (or create) signing files
        script: |
          set -ex
          openssl genrsa -out /tmp/cert_priv.key 2048
          ls -la /tmp/cert_priv.key
          echo "Bundle: $BUNDLE_ID, Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_priv.key \
            --p12-password "$CERTIFICATE_PASSWORD" \
            --create \
            --verbose
      - name: Add fetched certificates to keychain
        script: |
          keychain add-certificates --certificate-password "$CERTIFICATE_PASSWORD"
      - name: Set up code signing in Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa with timestamp build number
        script: |
          # Use Unix timestamp as build number — guarantees monotonic increase
          # and avoids ENTITY_ERROR.DUPLICATE caused by stale Apple records.
          BUILD_NUMBER=$(date +%s)
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload IPA to App Store Connect (Codemagic native)
        script: |
          set -ex
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading $IPA_FILE via Codemagic CLI"

          # Codemagic CLI Tools — native App Store Connect publishing.
          # Reads APP_STORE_CONNECT_* env vars from the app_store_credentials group.
          # NOTE: no --testflight flag — that triggers external beta review submission
          # which requires Beta App Info (feedback email + contact). We only need the
          # binary uploaded so it's selectable for App Store version review.
          app-store-connect publish \
            --path "$IPA_FILE" \
            --enable-package-validation
      - name: Push metadata + screenshots (App Store Connect API, no fastlane)
        script: |
          set -e
          # Restore p8 to disk for the Python uploader.
          mkdir -p ~/.appstoreconnect/private_keys
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          if [ ! -f "$P8" ]; then
            python3 -c "import os, sys; v=os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].replace('\\\\n','\\n'); open(sys.argv[1],'w').write(v)" "$P8"
            chmod 600 "$P8"
          fi
          # PyJWT is needed for the JWT signing in the script.
          python3 -m pip install --quiet --user pyjwt cryptography || true
          # Text metadata (name/subtitle/description/keywords/etc) — pure ASC HTTP API.
          python3 scripts/asc_upload_metadata.py || echo "metadata upload step warned"
          # Screenshots — pure ASC HTTP API.
          python3 scripts/asc_upload_screenshots.py || echo "screenshot upload step warned"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Goalyn — App Store metadata + binary
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_STORE_APPLE_ID: "com.tanaltay.goalyn.app"
        BUNDLE_ID: "com.tanaltay.goalyn.app"
        LANG: "en_US.UTF-8"
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: 3.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Flutter pub get
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Initialize keychain & fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Push metadata + screenshots (App Store Connect API)
        script: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          if [ ! -f "$P8" ]; then
            python3 -c "import os, sys; v=os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].replace('\\\\n','\\n'); open(sys.argv[1],'w').write(v)" "$P8"
            chmod 600 "$P8"
          fi
          python3 -m pip install --quiet --user pyjwt cryptography || true
          python3 scripts/asc_upload_metadata.py || echo "metadata upload step warned"
          python3 scripts/asc_upload_screenshots.py || echo "screenshot upload step warned"
      - name: Upload binary to App Store Connect (Codemagic native)
        script: |
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -1)
          app-store-connect publish \
            --path "$IPA_FILE" \
            --enable-package-validation
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
